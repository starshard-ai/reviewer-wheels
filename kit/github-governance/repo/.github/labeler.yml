area/core:
  - changed-files:
      - any-glob-to-any-file:
          - src/**
          - lib/**
          - "**/core/**"
area/plugins:
  - changed-files:
      - any-glob-to-any-file:
          - plugins/**
          - "**/plugins/**"
area/integrations:
  - changed-files:
      - any-glob-to-any-file:
          - integrations/**
          - "**/providers/**"
          - "**/model_providers/**"
          - "**/runtimes/**"
area/cli:
  - changed-files:
      - any-glob-to-any-file:
          - cli/**
          - "**/cli/**"
          - bin/**
area/infra:
  - changed-files:
      - any-glob-to-any-file:
          - infra/**
          - services/**
          - deploy/**
          - Dockerfile*
          - docker-compose*
