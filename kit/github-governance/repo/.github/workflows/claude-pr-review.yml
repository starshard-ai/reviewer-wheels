name: Claude PR Review

# pull_request_target runs with the BASE repository's secrets so fork PRs can be
# reviewed. The checkout below has no `ref:` on purpose: only the base branch is
# ever checked out; the PR head is read through `gh pr diff`, never executed.
# See https://github.com/anthropics/claude-code-action/blob/main/docs/security.md

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-pr-review:
    if: ${{ vars.CLAUDE_REVIEW_ENABLED == 'true' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_non_write_users: "*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a comment-only first-pass pull request reviewer. Inspect the base checkout and pull request diff only. Do not execute untrusted code.

            Check: scope matches title; links an issue or explains why none is needed; verification section is filled per the repo template if present; tests are added or updated when applicable; docs are updated for user-visible behavior; no secrets, keys, credentials, or private endpoints appear in the diff; CI/workflow changes from first-time contributors have explicit maintainer acknowledgement; the PR is not a duplicate of another open PR; integration/provider/runtime/plugin changes should be marked status/needs-policy until a maintainer policy exists.

            Post ONE sticky comment with a table: check -> pass/fail/n.a. -> evidence. Do NOT approve, request changes, merge, or close. If nothing is wrong, say so in two lines.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
            --max-turns 20
