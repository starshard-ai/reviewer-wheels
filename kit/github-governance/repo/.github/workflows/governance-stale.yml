name: Governance Stale

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-needs-info:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale needs-info threads
        uses: actions/stale@v9
        with:
          only-labels: status/needs-info
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: status/stale
          stale-pr-label: status/stale
          stale-issue-message: "This issue is waiting on requested information and has gone stale. It will close in 7 days if no new information arrives."
          stale-pr-message: "This pull request is waiting on requested information and has gone stale. It will close in 7 days if no new information arrives."
          close-issue-message: "Closing because requested information did not arrive after the needs-info window. Reopen with the missing details if this is still relevant."
          close-pr-message: "Closing because requested information did not arrive after the needs-info window. Reopen with the missing details if this is still relevant."
          exempt-issue-labels: status/accepted,kind/security,prio/p0,prio/p1
          exempt-pr-labels: status/ready-for-maintainer,kind/security
          operations-per-run: 100
