  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - test/**
          - "**/*_test.*"
          - "**/test_*.*"
area/examples:
  - changed-files:
      - any-glob-to-any-file:
          - examples/**
area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
area/legal:
  - changed-files:
      - any-glob-to-any-file:
          - LICENSE*
          - docs/legal/**
